if(d.weaponPage!==undefined){turnWeaponPage(+d.weaponPage)}else if(d.survivalVariant){survivalVariant=d.survivalVariant;savePrefs();menu()}else if(d.mode){mode=d.mode;savePrefs();menu()}else if(d.difficulty){difficulty=d.difficulty;savePrefs();menu()}else if(d.config!==undefined)armory(+d.config);else if(d.equipfast){let slot=+overlay.dataset.slot,other=selected.indexOf(d.equipfast);if(other>=0)[selected[slot],selected[other]]=[selected[other],selected[slot]];else selected[slot]=d.equipfast;savePrefs();armory(slot);}else if(d.choose!==undefined){if(battle.choose(+d.choose)){sound.play('upgrade');shop();}}else if(d.reward!==undefined){if(battle.claimReward(+d.reward)){sound.play('upgrade');rewardsPanel();}}else if(d.boost!==undefined){if(battle.boost(+d.boost)){sound.play('upgrade');battle.state==='reward'?rewardsPanel():shop();}}else if(d.number!==undefined){let id=battle.loadout[+d.number];$('#numberText').textContent=upgradeText(id,battle.level(id),battle.power,battle.rate);for(let n of document.querySelectorAll('[data-number]'))n.classList.toggle('on',n===el);}else if(d.evonumber!==undefined){$('#evoChoices').innerHTML=evoChoices(battle.loadout[+d.evonumber]);}else if(d.evolve){if(battle.evolve(d.evolve,+d.path)){sound.play('upgrade');battle.state==='reward'?rewardsPanel():shop();toast(weapon(d.evolve).name+' · '+EVOLUTIONS[d.evolve][+d.path][0]);}}else if(d.help!==undefined)help(+d.help);else switch(d.action){case 'start':case 'retry':await start();break;case 'continue':resumeCheckpoint();break;case 'menu':case 'leave':menu();break;case 'resume':pause();break;case 'help':help();break;case 'helpback':if(helpReturn==='paused'){battle.state='playing';pause()}else menu();break;case 'settings':settings();break;case 'closeSettings':settingsReturn?.();break;case 'testMusic':{let ok=await unlock();sound.setMode('battle');$('#audioStatus').textContent=ok?'正在试听配乐':'音频未启动，请检查声音权限。';}break;case 'testSfx':{let ok=await unlock();sound.play('explosion');$('#audioStatus').textContent=ok?'已播放战斗音效':'音频未启动，请检查声音权限。';}break;case 'next':if(battle.next()){hide();slots();hud();audioMode()}break;case 'repair':if(battle.repair())battle.state==='reward'?rewardsPanel():shop();break;case 'reroll':if(battle.reroll())shop();break;case 'rerollReward':if(battle.rerollReward())rewardsPanel();break;case 'closeReward':closeRewards();break;}
};
$('#audioBtn').onclick=settings;$('#pause').onclick=pause;$('#burst').onclick=()=>battle?.burst();$('#barrier').onclick=()=>battle?.barrier();$('#rewardBtn').onclick=()=>{if(battle?.mode==='survival')rewardsPanel()};
function layout(){let v=window.visualViewport;document.documentElement.style.setProperty('--view-h',(v?.height||innerHeight)+'px');document.documentElement.style.setProperty('--view-w',(v?.width||innerWidth)+'px');renderer.resize();}
function syncFullscreen(){let full=!!(document.fullscreenElement||document.webkitFullscreenElement);$('#fullscreenBtn').hidden=full;document.body.classList.toggle('fullscreen',full);layout();requestAnimationFrame(layout)}
$('#fullscreenBtn').onclick=async()=>{let root=document.documentElement,request=root.requestFullscreen||root.webkitRequestFullscreen;if(!request){toast('此浏览器不支持网页全屏，请在支持全屏的浏览器打开。');return}try{await request.call(root);syncFullscreen()}catch{toast('全屏未成功，请直接在浏览器打开游戏再试。')}};
for(let name of ['fullscreenchange','webkitfullscreenchange'])document.addEventListener(name,syncFullscreen);
window.addEventListener('resize',layout);window.visualViewport?.addEventListener('resize',layout);window.addEventListener('orientationchange',()=>requestAnimationFrame(layout));new ResizeObserver(()=>renderer.resize()).observe($('#arena'));
function aim(e){if(battle?.state!=='playing')return;let r=canvas.getBoundingClientRect();battle.aim={x:Math.max(15,Math.min(405,(e.clientX-r.left)/r.width*W)),y:Math.max(175,Math.min(618,150+(e.clientY-r.top)/r.height*580))}}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);aim(e)});canvas.addEventListener('pointermove',e=>{if(canvas.hasPointerCapture(e.pointerId))aim(e)});for(let name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,()=>{if(battle)battle.aim=null});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(battle?.state==='playing')pause();sound.suspend()}else if(sound.ctx){sound.unlock();audioMode()}});
window.addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(e.code==='Space'){e.preventDefault();battle?.burst()}if(e.code==='KeyF'&&battle?.allWeapons&&screen==='playing'){e.preventDefault();battle.skillAll();hud()}if(e.code==='KeyR'){e.preventDefault();battle?.barrier()}if(e.code==='Escape'){if(screen==='reward')closeRewards();else if(screen==='playing'||screen==='paused')pause()}if(e.code==='KeyT'&&battle?.mode==='survival'){e.preventDefault();if(screen==='reward')closeRewards();else if(battle.state==='playing')rewardsPanel()}if(['KeyQ','KeyW','KeyE'].includes(e.code)&&battle)battle.skill(battle.loadout[weaponPage*3+['KeyQ','KeyW','KeyE'].indexOf(e.code)]);if(['KeyA','KeyD'].includes(e.code)&&battle?.allWeapons&&screen==='playing'){e.preventDefault();turnWeaponPage(e.code==='KeyA'?-1:1)}});
function frame(now){let dt=Math.min((now-last)/1000,.04);last=now;if(battle){battle.update(dt);for(let event of battle.events.splice(0)){if(event.type==='wave'){announce(event.text);audioMode()}else if(event.type==='upgrade'){shopTab='free';reportPage=0;shop();sound.play('upgrade')}else if(event.type==='end')end(event.win);else if(event.type==='warning')announce(event.text);else if(event.type==='reward'){announce('◆ '+event.text);sound.play('upgrade')}else if(event.type==='skill'){announce(weapon(event.id).icon+' '+SKILLS[event.id].name);sound.play('skill',event.id);}else if(event.type==='burst'){announce('❄ 冻结 3秒 · 射速翻倍');sound.play('burst')}else if(event.type==='barrier'){announce(event.text||`⬡ 城防护盾 · +${Math.round(event.amount||0)}`);sound.play('burst')}else if(event.type==='emergency'){announce(event.text);sound.play('burst')}else if(event.type==='kill'){if(event.boss)sound.play('explosion')}else sound.play(event.type,event.id)}}clock+=dt;if(clock>.1){hud();clock=0}renderer.draw(battle,now/1000);requestAnimationFrame(frame)}
layout();menu();syncFullscreen();requestAnimationFrame(frame);

})();</script></body></html>
